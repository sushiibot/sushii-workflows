name: Zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: Zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  release-tests:
    name: Release preset tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Offline release tests
        run: uv run --python 3.13 --with pyyaml==6.0.2 python -m unittest discover -s tests -v
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7


  release-tools-smoke:
    name: Release helper action smoke test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Exercise helper action and outputs
        id: identity
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: build_identity
        env:
          REPOSITORY: example/worker
          IMAGE: ''
          ARTIFACT: ''
          DOCKERFILE: Dockerfile
          BUILD_TARGET: ''
      - name: Verify composite output forwarding
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          TAG: ${{ steps.identity.outputs.tag }}
          BUILD_DATE: ${{ steps.identity.outputs.build_date }}
        run: |
          test "$IMAGE" = ghcr.io/example/worker
          test "$TAG" = "ghcr.io/example/worker:$GITHUB_SHA"
          test -n "$BUILD_DATE"
