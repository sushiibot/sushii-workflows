name: Request registry release

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      artifact_digest:
        type: string
        required: true
      environment:
        description: Optional project environment gate before publishing release intent
        type: string
        default: ""
      allow_manual:
        type: boolean
        default: false
      provenance:
        type: string
        default: attested
      artifact_kind:
        type: string
        default: oci
      image_name:
        type: string
        default: ''
      artifact_name:
        type: string
        default: ''
      release_id:
        type: string
        default: ''
      release_asset_id:
        type: string
        default: ''
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        required: true
    outputs:
      deployed:
        value: ${{ jobs.wait.outputs.deployed }}

permissions: {}

jobs:
  publish:
    environment: ${{ inputs.environment }}
    if: (github.event_name == 'push' || (inputs.allow_manual && inputs.provenance == 'github-actions' && github.event_name == 'workflow_dispatch')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Construct release intent
        env:
          TARGET: ${{ inputs.target }}
          DIGEST: ${{ inputs.artifact_digest }}
          PROVENANCE: ${{ inputs.provenance }}
          ARTIFACT_KIND: ${{ inputs.artifact_kind }}
          IMAGE: ${{ inputs.image_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          import hashlib, urllib.parse, urllib.request
          from pathlib import Path
          target, digest = os.environ['TARGET'], os.environ['DIGEST']
          assert re.fullmatch(r'[a-z0-9][a-z0-9-]*', target), 'Invalid target'
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Invalid digest'
          request = dict(schema_version=1, target=target, artifact_digest=digest,
                         source_sha=os.environ['GITHUB_SHA'], run_id=int(os.environ['GITHUB_RUN_ID']),
                         run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
          directory = Path(os.environ['RUNNER_TEMP']) / 'release-request'
          directory.mkdir()
          (directory / 'request.json').write_text(json.dumps(request, sort_keys=True) + '\n')
          mode = os.environ.get('PROVENANCE', 'attested')
          kind = os.environ.get('ARTIFACT_KIND', 'oci')
          assert mode in ('attested', 'github-actions')
          repository = os.environ['GITHUB_REPOSITORY'].lower()
          if kind == 'oci':
              import base64
              image = os.environ.get('IMAGE') or 'ghcr.io/' + repository
              assert re.fullmatch(r'ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+', image)
              package = image.removeprefix('ghcr.io/')
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{package}:pull'})
              headers = {}
              if os.environ.get('GH_TOKEN'):
                  basic = base64.b64encode(('token:' + os.environ['GH_TOKEN']).encode()).decode()
                  headers['Authorization'] = 'Basic ' + basic
              token_req = urllib.request.Request('https://ghcr.io/token?' + query, headers=headers)
              token = json.load(urllib.request.urlopen(token_req, timeout=30))['token']
              req = urllib.request.Request(f'https://ghcr.io/v2/{package}/manifests/{digest}', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  manifest = response.read(4 * 1024 * 1024 + 1)
              assert len(manifest) <= 4 * 1024 * 1024
              assert 'sha256:' + hashlib.sha256(manifest).hexdigest() == digest
          else:
              import subprocess
              assert kind == 'github-release-bundle' and mode == 'github-actions'
              ids = [os.environ['RELEASE_ID'], os.environ['RELEASE_ASSET_ID']]
              assert all(re.fullmatch(r'[1-9][0-9]{0,18}', value) for value in ids)
              release_id, asset_id = map(int, ids)
              metadata = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/releases/assets/{asset_id}'], text=True))
              assert metadata['id'] == asset_id and metadata['digest'] == digest
              assert 0 < metadata['size'] <= 32 * 1024 * 1024
              request.update(schema_version=2, release_id=release_id, release_asset_id=asset_id)
              (directory / 'request.json').write_text(json.dumps(request, sort_keys=True) + '\n')
              manifest = (json.dumps(dict(kind=kind, release_id=release_id, release_asset_id=asset_id,
                                         name=metadata['name'], size=metadata['size']), sort_keys=True) + '\n').encode()
          (directory / 'artifact-manifest.json').write_bytes(manifest)
          if mode == 'github-actions':
              for name in ('intent.sigstore.json', 'build.sigstore.json'):
                  (directory / name).write_text('{}\n')
          PY
      - name: Fetch this run's build evidence
        if: inputs.provenance == 'attested'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-provenance-${{ inputs.artifact_name != '' && format('{0}-', inputs.artifact_name) || '' }}${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-request
      - name: Sign explicit release intent
        if: inputs.provenance == 'attested'
        id: intent
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-request/request.json
      - name: Retain intent bundle
        if: inputs.provenance == 'attested'
        env:
          BUNDLE: ${{ steps.intent.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/release-request/intent.sigstore.json"
      - name: Publish release request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-request-${{ inputs.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-request/
          if-no-files-found: error
          retention-days: 90
      - name: Link release run
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "[Release request and result]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint importer dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUSHII_CI_CLIENT_ID }}
          private-key: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
          owner: sushiibot
          repositories: sushii-ansible
          permission-actions: write
      - name: Notify private release importer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          payload = {"ref": "main", "inputs": {
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "target": os.environ["TARGET"]}}
          subprocess.run(["gh", "api", "--method", "POST",
                          "repos/sushiibot/sushii-ansible/actions/workflows/import-release.yml/dispatches",
                          "--input", "-"], input=json.dumps(payload), text=True, check=True)
          PY

  wait:
    needs: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    outputs:
      deployed: ${{ steps.wait.outputs.deployed }}
    steps:
      - name: Wait for exact host receipt
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          DIGEST: ${{ inputs.artifact_digest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          context = f"release/{os.environ['TARGET']}/{os.environ['GITHUB_RUN_ID']}/{os.environ['GITHUB_RUN_ATTEMPT']}"
          path = f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/statuses?per_page=100"
          deadline = time.monotonic() + 1800
          while time.monotonic() < deadline:
              pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', path], text=True))
              statuses = [status for page in pages for status in page]
              status = next((s for s in statuses if s['context'] == context and
                             (s.get('creator') or {}).get('id') == 342252709), None)
              if status and status['state'] == 'success':
                  assert status['description'] == 'deployed ' + os.environ['DIGEST'], 'Receipt digest mismatch'
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('deployed=true\n')
                  print('Host deployed the requested immutable artifact.')
                  break
              if status and status['state'] in ('failure', 'error'):
                  raise SystemExit('Release rejected or deployment failed; inspect the release status.')
              time.sleep(15)
          else:
              raise SystemExit('No matching host deployment receipt within 30 minutes.')
          PY
