name: Request registry release

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      artifact_digest:
        type: string
        required: true
      environment:
        description: Optional project environment gate before publishing release intent
        type: string
        default: ""
      require_approval:
        type: boolean
        default: false
      allow_manual:
        type: boolean
        default: false
      provenance:
        type: string
        default: attested
      artifact_kind:
        type: string
        default: oci
      image_name:
        type: string
        default: ''
      artifact_name:
        type: string
        default: ''
      release_id:
        type: string
        default: ''
      release_asset_id:
        type: string
        default: ''
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        required: true
    outputs:
      deployed:
        value: ${{ jobs.wait.outputs.deployed }}

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Validate approval contract before the gate
        env:
          REQUIRE_APPROVAL: ${{ inputs.require_approval }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROVENANCE: ${{ inputs.provenance }}
          ARTIFACT_KIND: ${{ inputs.artifact_kind }}
          ALLOW_MANUAL: ${{ inputs.allow_manual }}
          GH_TOKEN: ${{ github.token }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: approval_preflight

  publish:
    needs: preflight
    environment: ${{ inputs.environment }}
    if: (github.event_name == 'push' || (inputs.allow_manual && inputs.provenance == 'github-actions' && github.event_name == 'workflow_dispatch')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Construct release intent
        env:
          REQUIRE_APPROVAL: ${{ inputs.require_approval }}
          ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_MANUAL: ${{ inputs.allow_manual }}
          TARGET: ${{ inputs.target }}
          DIGEST: ${{ inputs.artifact_digest }}
          PROVENANCE: ${{ inputs.provenance }}
          ARTIFACT_KIND: ${{ inputs.artifact_kind }}
          IMAGE: ${{ inputs.image_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_ASSET_ID: ${{ inputs.release_asset_id }}
          GH_TOKEN: ${{ github.token }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: release_intent

      - name: Fetch this run's build evidence
        if: inputs.provenance == 'attested'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-provenance-${{ inputs.artifact_name != '' && format('{0}-', inputs.artifact_name) || '' }}${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-build-evidence
      - name: Accept only build evidence from the artifact
        if: inputs.provenance == 'attested'
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: build_evidence

      - name: Sign explicit release intent
        if: inputs.provenance == 'attested'
        id: intent
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-request/request.json
      - name: Retain intent bundle
        if: inputs.provenance == 'attested'
        env:
          BUNDLE: ${{ steps.intent.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/release-request/intent.sigstore.json"
      - name: Publish release request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-request-${{ inputs.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-request/
          if-no-files-found: error
          retention-days: 90
      - name: Link release run
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "[Release request and result]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint importer dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUSHII_CI_CLIENT_ID }}
          private-key: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
          owner: sushiibot
          repositories: sushii-ansible
          permission-actions: write
      - name: Notify private release importer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ inputs.target }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: dispatch_importer

  wait:
    needs: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    outputs:
      deployed: ${{ steps.wait.outputs.deployed }}
    steps:
      - name: Wait for exact host receipt
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          DIGEST: ${{ inputs.artifact_digest }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: wait_receipt
