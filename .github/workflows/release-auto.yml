name: Release

on:
  workflow_call:
    inputs:
      service:
        description: "Service path; defaults to repository variable RELEASE_SERVICE"
        type: string
        default: ""
      host:
        description: "Host; defaults to repository variable RELEASE_HOST, then apps"
        type: string
        default: ""
      image_version:
        description: "Built SHA tag from this push (7-40 hex characters)"
        type: string
        required: true
      environment:
        type: string
        default: ""
      require_approval:
        description: "Require reviewers on the selected environment before deployment"
        type: boolean
        default: false
      allow_manual:
        description: "Also accept an explicit workflow_dispatch on the default branch"
        type: boolean
        default: false
      timeout_minutes:
        type: number
        default: 15
      job_timeout_minutes:
        type: number
        default: 30
      receipt_name:
        description: "Set staging-release when this deployment can be promoted later"
        type: string
        default: ""
    outputs:
      deployed:
        description: "True only after host success"
        value: ${{ jobs.deploy.outputs.deployed }}
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  approval-config:
    if: inputs.require_approval && (github.event_name == 'push' || (inputs.allow_manual && github.event_name == 'workflow_dispatch')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
    uses: ./.github/workflows/_release-approval.yml
    with:
      production_environment: ${{ inputs.environment }}

  deploy:
    needs: approval-config
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || (inputs.allow_manual && github.event_name == 'workflow_dispatch')) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.approval-config.result == 'success' || (!inputs.require_approval && needs.approval-config.result == 'skipped'))
    permissions:
      statuses: write
      contents: read
    uses: ./.github/workflows/pull-deploy.yml
    with:
      service: ${{ inputs.service || vars.RELEASE_SERVICE }}
      host: ${{ inputs.host || vars.RELEASE_HOST || 'apps' }}
      image_version: ${{ inputs.image_version }}
      environment: ${{ inputs.environment }}
      receipt_name: ${{ inputs.receipt_name }}
      require_deploy_success: true
      timeout_minutes: ${{ inputs.timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
