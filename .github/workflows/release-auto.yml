name: Release

on:
  workflow_call:
    inputs:
      service:
        description: "Service path; defaults to repository variable RELEASE_SERVICE"
        type: string
        default: ""
      host:
        description: "Host; defaults to repository variable RELEASE_HOST, then apps"
        type: string
        default: ""
      image_version:
        description: "Built SHA tag from this push (7-40 hex characters)"
        type: string
        default: ""
      target:
        description: Logical registry target for a verified artifact release
        type: string
        default: ""
      artifact_digest:
        type: string
        default: ""
      environment:
        type: string
        default: ""
      require_approval:
        description: "Require reviewers on the selected environment before deployment"
        type: boolean
        default: false
      allow_manual:
        description: "Also accept an explicit workflow_dispatch on the default branch"
        type: boolean
        default: false
      timeout_minutes:
        type: number
        default: 15
      job_timeout_minutes:
        type: number
        default: 30
      receipt_name:
        description: "Set staging-release when this deployment can be promoted later"
        type: string
        default: ""
      provenance:
        type: string
        default: attested
      artifact_kind:
        type: string
        default: oci
      image_name:
        type: string
        default: ''
      artifact_name:
        type: string
        default: ''
      release_id:
        type: string
        default: ''
      release_asset_id:
        type: string
        default: ''
    outputs:
      deployed:
        description: "True only after host success"
        value: ${{ jobs.deploy.outputs.deployed || jobs.registry.outputs.deployed }}
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  registry-inputs:
    if: inputs.target != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the automatic registry contract
        env:
          APPROVAL: ${{ inputs.require_approval }}
          MANUAL: ${{ inputs.allow_manual }}
          PROVENANCE: ${{ inputs.provenance }}
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          HOST: ${{ inputs.host }}
          VERSION: ${{ inputs.image_version }}
        run: |
          [[ "$APPROVAL" == false ]]
          [[ "$MANUAL" == false || "$PROVENANCE" == github-actions ]]
          [[ -z "$ENVIRONMENT$SERVICE$HOST$VERSION" ]]

  registry:
    needs: registry-inputs
    if: inputs.target != ''
    permissions:
      contents: read
      actions: read
      packages: read
      statuses: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release-request.yml
    with:
      target: ${{ inputs.target }}
      artifact_digest: ${{ inputs.artifact_digest }}
      allow_manual: ${{ inputs.allow_manual }}
      provenance: ${{ inputs.provenance }}
      artifact_kind: ${{ inputs.artifact_kind }}
      image_name: ${{ inputs.image_name }}
      artifact_name: ${{ inputs.artifact_name }}
      release_id: ${{ inputs.release_id }}
      release_asset_id: ${{ inputs.release_asset_id }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  approval-config:
    if: inputs.require_approval && (github.event_name == 'push' || (inputs.allow_manual && github.event_name == 'workflow_dispatch')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
    uses: ./.github/workflows/_release-approval.yml
    with:
      production_environment: ${{ inputs.environment }}

  deploy:
    needs: approval-config
    if: >-
      !cancelled() &&
      inputs.target == '' &&
      (github.event_name == 'push' || (inputs.allow_manual && github.event_name == 'workflow_dispatch')) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.approval-config.result == 'success' || (!inputs.require_approval && needs.approval-config.result == 'skipped'))
    permissions:
      statuses: write
      contents: read
    uses: ./.github/workflows/pull-deploy.yml
    with:
      service: ${{ inputs.service || vars.RELEASE_SERVICE }}
      host: ${{ inputs.host || vars.RELEASE_HOST || 'apps' }}
      image_version: ${{ inputs.image_version }}
      environment: ${{ inputs.environment }}
      receipt_name: ${{ inputs.receipt_name }}
      require_deploy_success: true
      timeout_minutes: ${{ inputs.timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
