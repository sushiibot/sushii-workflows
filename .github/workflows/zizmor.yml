name: Zizmor

on:
  workflow_call:
    inputs:
      inputs:
        description: "Path(s) to audit"
        required: false
        default: "."
        type: string
      persona:
        description: "Audit persona: regular, pedantic, or auditor"
        required: false
        default: "regular"
        type: string

permissions: {}

jobs:
  zizmor:
    name: Zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: ${{ inputs.inputs }}
          persona: ${{ inputs.persona }}
