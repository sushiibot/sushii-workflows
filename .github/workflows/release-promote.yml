name: Promote Staging Release

on:
  workflow_call:
    inputs:
      staging_run_id:
        description: "Successful default-branch push run that uploaded the staging receipt"
        type: string
        required: true
      staging_workflow:
        description: "Trusted source workflow path; configure in YAML, not a dispatch input"
        type: string
        default: .github/workflows/ci.yml
      receipt_name:
        type: string
        default: staging-release
      staging_service:
        description: "Defaults to repository variable STAGING_SERVICE"
        type: string
        default: ""
      staging_host:
        description: "Defaults to repository variable STAGING_HOST, then apps"
        type: string
        default: ""
      production_service:
        description: "Defaults to repository variable PRODUCTION_SERVICE"
        type: string
        default: ""
      production_host:
        description: "Defaults to repository variable PRODUCTION_HOST, then apps"
        type: string
        default: ""
      production_environment:
        type: string
        default: production
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  approval-config:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
    uses: ./.github/workflows/_release-approval.yml
    with:
      production_environment: ${{ inputs.production_environment }}

  resolve:
    needs: approval-config
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      image_version: ${{ steps.receipt.outputs.image_version }}
      source_sha: ${{ steps.receipt.outputs.source_sha }}
    steps:
      - name: Mint read-only infrastructure status token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUSHII_CI_CLIENT_ID }}
          private-key: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
          owner: sushiibot
          repositories: sushii-ansible
          permission-statuses: read

      - name: Resolve successful staging receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.staging_run_id }}
          WORKFLOW_PATH: ${{ inputs.staging_workflow }}
          RECEIPT_NAME: ${{ inputs.receipt_name }}
          STAGING_SERVICE: ${{ inputs.staging_service || vars.STAGING_SERVICE }}
          STAGING_HOST: ${{ inputs.staging_host || vars.STAGING_HOST || 'apps' }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: resolve_promotion

  production:
    needs: resolve
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.production_service || vars.PRODUCTION_SERVICE }}
      cancel-in-progress: false
    permissions:
      statuses: write
      contents: read
    uses: ./.github/workflows/pull-deploy.yml
    with:
      service: ${{ inputs.production_service || vars.PRODUCTION_SERVICE }}
      host: ${{ inputs.production_host || vars.PRODUCTION_HOST || 'apps' }}
      image_version: ${{ needs.resolve.outputs.image_version }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      environment: ${{ inputs.production_environment }}
      require_deploy_success: true
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
