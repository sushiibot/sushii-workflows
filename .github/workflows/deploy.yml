name: Ansible Deploy

on:
  workflow_call:
    inputs:
      service:
        description: "Service path (e.g., modmail/sushii-modmail-staging)"
        required: true
        type: string
      image_version:
        description: "Docker image tag to deploy"
        required: true
        type: string
      host:
        description: "Target Ansible host"
        required: false
        default: "apps"
        type: string
      environment:
        description: "GitHub environment name for protection rules"
        required: false
        default: ""
        type: string
      ansible_tags:
        description: "Ansible tags to run"
        required: false
        default: "deploy"
        type: string
      private_registry:
        description: "Log into ghcr.io before pulling (for private images)"
        required: false
        default: false
        type: boolean
    secrets:
      ANSIBLE_REPO_TOKEN:
        required: true
      ANSIBLE_SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_KNOWN_HOSTS:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      REGISTRY_TOKEN:
        description: "Token for ghcr.io login (pass GITHUB_TOKEN from caller)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout sushii-ansible
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sushiibot/sushii-ansible
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible Galaxy dependencies
        run: ansible-galaxy install -r requirements.yml

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.ANSIBLE_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Bump pinned image tag in vars.yml
        run: ./scripts/bump-image-tag.sh "${INPUTS_SERVICE}" "${INPUTS_IMAGE_VERSION}"
        env:
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}

      - name: Commit and push updated vars.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/ inventory/
          if git diff --cached --quiet; then
            echo "No changes — vars.yml already up to date"
          else
            git commit -m "chore: bump ${INPUTS_SERVICE} to ${INPUTS_IMAGE_VERSION}"
            git push
          fi
        env:
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}

      - name: Remove group vault file
        run: rm -f inventory/group_vars/all/vault.yml

      - name: Run Ansible deploy
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          INPUTS_HOST: ${{ inputs.host }}
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}
          INPUTS_ANSIBLE_TAGS: ${{ inputs.ansible_tags }}
        run: |
          ansible-playbook playbooks/deploy.yml \
            --vault-password-file ./vault-env \
            -l "${INPUTS_HOST}" \
            -e "service=${INPUTS_SERVICE}" \
            -e "image_version=${INPUTS_IMAGE_VERSION}" \
            -e "docker_image_check_version=${INPUTS_IMAGE_VERSION}" \
            ${{ inputs.private_registry && format('-e "docker_registry_user={0}" -e "docker_registry_password={1}"', github.repository_owner, secrets.REGISTRY_TOKEN) || '' }} \
            --tags "${INPUTS_ANSIBLE_TAGS}" \
            -v
