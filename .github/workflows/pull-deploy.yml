name: Pull Deploy

# Bumps the service's image tag in sushii-ansible, then waits for the host's pull deployer
# (sushii-ansible roles/pull_deploy) to report the deploy as a commit status on the bump commit.

on:
  workflow_call:
    inputs:
      service:
        description: "Service path (e.g., private-bots/omakase)"
        required: true
        type: string
      image_version:
        description: "Docker image tag to deploy"
        required: true
        type: string
      host:
        description: "Host whose pull deployer runs this service"
        required: false
        default: "apps"
        type: string
      environment:
        description: "GitHub environment for deployment history and protection rules"
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: "How long to wait for the host's deploy status"
        required: false
        default: 15
        type: number
      job_timeout_minutes:
        description: "Job timeout; must exceed timeout_minutes plus a few minutes for the bump"
        required: false
        default: 30
        type: number
      require_deploy_success:
        description: "Fail closed on missing host evidence, stale versions, or unverifiable ancestry"
        type: boolean
        default: false
      source_sha:
        description: "Original source commit for a validated manual promotion"
        type: string
        default: ""
      receipt_name:
        description: "Optional artifact name for a successful SHA-tag deployment receipt"
        type: string
        default: ""
    outputs:
      deployed:
        description: "True only when the host reported success"
        value: ${{ jobs.deploy.outputs.deployed }}
      infra_sha:
        description: "Infrastructure commit with the successful host status"
        value: ${{ jobs.deploy.outputs.infra_sha }}
    secrets:
      SUSHII_CI_PRIVATE_KEY:
        description: "sushii-ci App key; pair with the SUSHII_CI_CLIENT_ID variable"
        required: true

# Inherit the calling job's permissions. Existing callers grant statuses: write;
# presets also grant contents: read for fail-closed ancestry checks in private repos.
# Declaring contents: read here would break legacy callers that only grant statuses.
# zizmor: ignore[excessive-permissions] reusable workflow intentionally inherits the caller's explicit permissions

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || inputs.service }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    outputs:
      deployed: ${{ steps.wait.outputs.deployed }}
      infra_sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Validate preset inputs
        if: inputs.require_deploy_success || inputs.receipt_name != ''
        env:
          SERVICE: ${{ inputs.service }}
          HOST: ${{ inputs.host }}
          VERSION: ${{ inputs.image_version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RECEIPT_NAME: ${{ inputs.receipt_name }}
          STRICT: ${{ inputs.require_deploy_success }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
          JOB_TIMEOUT: ${{ inputs.job_timeout_minutes }}
        run: |
          [[ "$SERVICE" =~ ^[a-z0-9-]+/[a-z0-9-]+$ && "$HOST" =~ ^[a-z0-9-]+$ ]]
          [[ "$VERSION" =~ ^[0-9a-f]{7,40}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$VERSION"* ]]
          [[ -z "$RECEIPT_NAME" || "$RECEIPT_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ -z "$RECEIPT_NAME" || "$STRICT" == true ]]
          [[ "$TIMEOUT" =~ ^[1-9][0-9]*$ && "$JOB_TIMEOUT" =~ ^[1-9][0-9]*$ ]]
          (( JOB_TIMEOUT >= TIMEOUT + 5 ))

      - name: Mint sushii-ansible token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUSHII_CI_CLIENT_ID }}
          private-key: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
          owner: sushiibot
          repositories: sushii-ansible
          permission-contents: write
          permission-statuses: read

      - name: Checkout sushii-ansible # zizmor: ignore[artipacked] the push step below reuses these credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sushiibot/sushii-ansible
          token: ${{ steps.app-token.outputs.token }}
          # The already-pinned path looks up the commit that set the tag; a shallow clone has no history to search.
          fetch-depth: 0

      # Approving an older run after a newer one deployed must not pin the older image: hosts reject backward
      # bumps and stop verifying commits until an operator accepts one.
      - name: Skip if a newer version is already pinned
        id: guard
        run: |
          unverifiable() {
            echo "::warning::$1"
            if [ "$STRICT" = true ]; then exit 1; fi
            exit 0
          }
          key=$(yq ".services[\"${INPUTS_SERVICE}\"].version_key" services/repos.yml)
          repo=$(yq ".services[\"${INPUTS_SERVICE}\"].repo" services/repos.yml)
          [[ "$key" =~ ^[a-z0-9_]+$ && "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || unverifiable "Invalid service repository mapping"
          if [ "$STRICT" = true ] && [ "$repo" != "$CALLER_REPO" ]; then
            echo "::error::Service belongs to another repository"
            exit 1
          fi
          # The host rejects an unsigned bump to a commit off the default branch and then deploys nothing.
          if default=$(gh api "repos/${repo}" --jq .default_branch) \
            && on_main=$(gh api "repos/${repo}/compare/${INPUTS_IMAGE_VERSION}...${default}" --jq .status); then
            case "$on_main" in
              ahead|identical) ;;
              *)
                echo "::error::${repo} ${INPUTS_IMAGE_VERSION} is no longer on ${default} (${on_main}); was ${default} force-pushed? Not bumping: the host would reject it and block every deploy on it"
                exit 1 ;;
            esac
          else
            if [ "$STRICT" = true ]; then exit 1; fi
            echo "::warning::Couldn't check that ${INPUTS_IMAGE_VERSION} is on ${repo}'s default branch"
          fi
          file=$(grep -rlE --include=vars.yml "^${key}:" services/ inventory/host_vars/ | head -1)
          [ -n "$file" ] || unverifiable "Missing version file"
          current=$(yq ".${key}" "$file")
          [[ "$current" =~ ^[0-9a-f]{7,40}$ ]] || unverifiable "Invalid current version"
          if ! status=$(gh api "repos/${repo}/compare/${current}...${INPUTS_IMAGE_VERSION}" --jq .status); then
            echo "::warning::Couldn't compare ${current}...${INPUTS_IMAGE_VERSION} in ${repo}; bumping without the newer-version check"
            if [ "$STRICT" = true ]; then exit 1; fi
            exit 0
          fi
          case "$status" in
            ahead|identical) ;;
            behind)
              echo "::notice::${repo} ${INPUTS_IMAGE_VERSION} is older than the pinned ${current}; nothing to deploy"
              if [ "$STRICT" = true ]; then exit 1; fi
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::${repo} ${INPUTS_IMAGE_VERSION} has diverged from the pinned ${current}, so the pinned commit left ${default:-the default branch}. CI can't move this pin: push an operator-signed sushii-ansible commit setting ${key} to ${INPUTS_IMAGE_VERSION}"
              exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          STRICT: ${{ inputs.require_deploy_success }}
          CALLER_REPO: ${{ github.repository }}
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}

      - name: Bump pinned image tag
        if: steps.guard.outputs.skip != 'true'
        run: ./scripts/bump-image-tag.sh "${INPUTS_SERVICE}" "${INPUTS_IMAGE_VERSION}"
        env:
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}

      - name: Commit and push
        id: push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "sushii-ci[bot]"
          git config user.email "342252709+sushii-ci[bot]@users.noreply.github.com"
          git add services/ inventory/
          if git diff --cached --quiet; then
            # Already pinned (e.g. a re-run): report the status of the commit that set the tag.
            key=$(yq ".services[\"${INPUTS_SERVICE}\"].version_key" services/repos.yml)
            echo "sha=$(git log -1 --format=%H -G "^${key}:" -- services/ inventory/host_vars/)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump ${INPUTS_SERVICE} to ${INPUTS_IMAGE_VERSION}"
          # Other repos' deploys bump sushii-ansible concurrently.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
            git pull --rebase origin main
          done
          exit 1
        env:
          INPUTS_SERVICE: ${{ inputs.service }}
          INPUTS_IMAGE_VERSION: ${{ inputs.image_version }}

      - name: Wait for host deploy
        id: wait
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Mirrors the host's status onto the calling commit; the caller grants statuses: write.
          REPO_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ inputs.source_sha || github.sha }}
          STRICT: ${{ inputs.require_deploy_success }}
          SHA: ${{ steps.push.outputs.sha }}
          CHANGED: ${{ steps.push.outputs.changed }}
          CONTEXT: deploy/${{ inputs.host }}/${{ inputs.service }}
          TRUST_CONTEXT: deploy/${{ inputs.host }}/trust
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          mirror() {
            local args=(-f "state=$1" -f "context=${CONTEXT}" -f "description=${2:0:140}")
            if [ -n "${url:-}" ]; then args+=(-f "target_url=${url}"); fi
            GH_TOKEN="$REPO_TOKEN" gh api -X POST "repos/${CALLER_REPO}/statuses/${CALLER_SHA}" "${args[@]}" >/dev/null \
              || echo "::warning::Could not post ${CONTEXT} to ${CALLER_REPO}; grant the deploy job statuses: write"
          }
          finish() {
            mirror "$1" "$2"
            {
              echo "### ${CONTEXT}: $1"
              echo "$2"
              echo
              echo "- sushii-ansible commit: https://github.com/sushiibot/sushii-ansible/commit/${SHA}"
              if [ -n "${url:-}" ]; then echo "- [Deploy logs in Grafana](${url})"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$1" = success ]
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit
          }
          echo "Waiting for ${CONTEXT} on sushiibot/sushii-ansible@${SHA}"
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          mirrored=
          while :; do
            # Newest first; the first entry per context is its current state.
            statuses=$(gh api "repos/sushiibot/sushii-ansible/commits/${SHA}/statuses?per_page=100")
            state=$(jq -r --arg c "$CONTEXT" '[.[] | select(.context == $c)][0] | .state // empty' <<<"$statuses")
            desc=$(jq -r --arg c "$CONTEXT" '[.[] | select(.context == $c)][0] | .description // empty' <<<"$statuses")
            trust_state=$(jq -r --arg c "$TRUST_CONTEXT" '[.[] | select(.context == $c)][0] | .state // empty' <<<"$statuses")
            trust=$(jq -r --arg c "$TRUST_CONTEXT" '[.[] | select(.context == $c)][0] | .description // empty' <<<"$statuses")
            url=$(jq -r --arg c "$CONTEXT" '[.[] | select(.context == $c)][0] | .target_url // empty' <<<"$statuses")
            # A blocked commit's failure is superseded by success once the host trusts it.
            if [ "$trust_state" = failure ] || [ "$trust_state" = error ]; then
              echo "::error::Host rejected the commit: ${trust}"
              finish error "host rejected the sushii-ansible commit: ${trust}"
            fi
            case "$state" in
              success) echo "Deployed: ${desc}"; finish success "$desc" ;;
              failure|error) echo "::error::${CONTEXT} failed: ${desc}"; finish failure "$desc" ;;
              pending)
                if [ "${mirrored}" != "${url}" ]; then
                  echo "Deploy logs: ${url}"
                  mirror pending "$desc"
                  mirrored=$url
                fi ;;
            esac
            if [ -z "$state" ] && [ "$CHANGED" = "false" ]; then
              if [ "$STRICT" = true ]; then
                finish error "Tag is pinned but has no successful host deployment evidence"
              fi
              echo "Tag already pinned and that commit has no deploy status (it predates pull deploys); nothing to wait for."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No final deploy status after ${TIMEOUT_MINUTES}m (last: ${state:-none}). On the host: sushii-pull status; journalctl -u sushii-pull"
              finish error "no result from the host after ${TIMEOUT_MINUTES}m"
            fi
            sleep 15
          done

      - name: Record successful deployment
        if: inputs.receipt_name != '' && steps.wait.outputs.deployed == 'true'
        env:
          RECEIPT_DIR: ${{ runner.temp }}/release-receipt
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SERVICE: ${{ inputs.service }}
          HOST: ${{ inputs.host }}
          INFRA_SHA: ${{ steps.push.outputs.sha }}
        uses: sushiibot/sushii-workflows/actions/release-tools@e47c3a6d9245d8aea41726ec5a7f36c12221b2d5
        with:
          command: deployment_receipt

      - name: Upload deployment receipt
        if: inputs.receipt_name != '' && steps.wait.outputs.deployed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.receipt_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipt/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Link release run
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "[Release run and approval]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"
