name: Docker Cleanup

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name (e.g., ghcr.io/sushiibot/modmail)"
        required: true
        type: string
      cut_off:
        description: "Age cutoff for deletion with timezone (e.g., 2w UTC, 30d UTC)"
        required: false
        default: "2w UTC"
        type: string
      keep_at_least:
        description: "Minimum number of versions to keep regardless of age"
        required: false
        default: 10
        type: number
      protect_tags:
        description: "Newline-separated list of tags to protect from deletion"
        required: false
        default: "latest"
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Extract bare image name
        id: image
        env:
          IMAGE: ${{ inputs.image_name }}
        run: |
          # e.g. ghcr.io/sushiibot/modmail -> org=sushiibot, name=modmail
          IMAGE_ORG=$(echo "$IMAGE" | cut -d'/' -f2)
          IMAGE_NAME=$(echo "$IMAGE" | cut -d'/' -f3-)
          echo "org_name=${IMAGE_ORG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Delete old package versions
        uses: snok/container-retention-policy@v2
        with:
          account-type: org
          org-name: ${{ steps.image.outputs.org_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ steps.image.outputs.image_name }}
          cut-off: ${{ inputs.cut_off }}
          keep-at-least: ${{ inputs.keep_at_least }}
          skip-tags: ${{ inputs.protect_tags }}
