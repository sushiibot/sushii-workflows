name: Docker Cleanup

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name (e.g., ghcr.io/sushiibot/modmail)"
        required: true
        type: string
      cut_off:
        description: "Age cutoff for deletion (e.g., 2w, 30d, 1h)"
        required: false
        default: "2w"
        type: string
      keep_n_most_recent:
        description: "Minimum number of versions to keep regardless of age"
        required: false
        default: 10
        type: number
      protect_tags:
        description: "Space or newline-separated list of tags to protect from deletion"
        required: false
        default: "latest"
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Extract bare image name
        id: image
        env:
          IMAGE: ${{ inputs.image_name }}
        run: |
          # e.g. ghcr.io/sushiibot/modmail -> org=sushiibot, name=modmail
          IMAGE_ORG=$(echo "$IMAGE" | cut -d'/' -f2)
          IMAGE_NAME=$(echo "$IMAGE" | cut -d'/' -f3-)
          echo "org_name=${IMAGE_ORG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build image-tags filter
        id: image_tags
        env:
          PROTECT_TAGS: ${{ inputs.protect_tags }}
        run: |
          # Convert space/newline-separated protect_tags to negated v3 image-tags format
          # e.g. "latest buildcache" -> "!latest !buildcache"
          IMAGE_TAGS=$(echo "$PROTECT_TAGS" | tr '\n' ' ' | awk '{for(i=1;i<=NF;i++) printf "!%s ", $i}' | xargs)
          echo "filter=${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Delete old package versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ steps.image.outputs.org_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ steps.image.outputs.image_name }}
          cut-off: ${{ inputs.cut_off }}
          keep-n-most-recent: ${{ inputs.keep_n_most_recent }}
          image-tags: ${{ steps.image_tags.outputs.filter }}
